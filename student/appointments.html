<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>GUIDE-Me · My Appointments | VSU Isabel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .phone-frame {
      width: 100%;
      max-width: 430px;
      height: 932px;
      margin: 0 auto;
      background-color: #F5F5F5;
      border-radius: 44px;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .main-content::-webkit-scrollbar {
      width: 4px;
    }
    .main-content::-webkit-scrollbar-track {
      background: #E8F5E9;
      border-radius: 4px;
    }
    .main-content::-webkit-scrollbar-thumb {
      background: #F9A825;
      border-radius: 4px;
    }

    /* Green Header */
    .green-header {
      background-color: #1B5E20;
      padding: 16px 20px 20px 20px;
      border-top-left-radius: 44px;
      border-top-right-radius: 44px;
      position: relative;
    }

    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .back-button {
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .back-button:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .back-arrow { color: white; font-size: 16px; font-weight: bold; }
    .back-text { color: white; font-size: 13px; font-weight: 500; }
    .student-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }
    .student-badge-text { color: white; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }
    .student-badge-icon { color: white; font-size: 16px; }

    /* Profile Dropdown */
    .profile-dropdown {
      position: absolute;
      top: 50px;
      right: 20px;
      background: white;
      width: 240px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      z-index: 100;
      display: none;
      overflow: hidden;
      animation: slideDown 0.2s ease;
    }
    .profile-dropdown.active { display: block; }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .dropdown-header { background: #F9A825; padding: 16px; text-align: center; }
    .dropdown-header h4 { color: #1B5E20; font-size: 14px; font-weight: bold; }
    .dropdown-header p { color: #1B5E20; font-size: 11px; opacity: 0.8; }
    .dropdown-item { padding: 14px 16px; border-bottom: 1px solid #F0F0F0; cursor: pointer; display: flex; align-items: center; gap: 12px; }
    .dropdown-item:hover { background: #F5F5F5; }
    .dropdown-text { font-size: 14px; color: #333; flex: 1; }
    .logout-text { color: #C62828; font-weight: 600; }

    /* Page Header */
    .page-header {
      background-color: #1B5E20;
      padding: 20px;
      text-align: center;
    }
    .page-header h1 { color: white; font-size: 20px; font-weight: bold; }
    .page-header p { color: #A5D6A7; font-size: 12px; margin-top: 4px; }

    /* Appointment Cards */
    .appointments-container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      border-left: 5px solid #F9A825;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .service-name {
      font-size: 16px;
      font-weight: bold;
      color: #1B5E20;
      margin-bottom: 8px;
    }
    .date {
      font-size: 13px;
      color: #777;
      margin-bottom: 6px;
    }
    .department {
      font-size: 13px;
      color: #777;
      margin-bottom: 6px;
    }
    .status-badge {
      font-size: 13px;
      font-weight: 600;
      margin-top: 4px;
      margin-bottom: 8px;
    }
    .status-badge.completed { color: #2E7D32; }
    .status-badge.declined { color: #C62828; }
    .status-badge.approved { color: #F9A825; }
    .status-badge.pending { color: #1565C0; }
    .referral-note {
      font-size: 12px;
      color: #1565C0;
      margin-top: 4px;
      margin-bottom: 8px;
    }
    .rejection-reason {
      font-size: 12px;
      color: #C62828;
      margin-top: 4px;
      margin-bottom: 8px;
      font-style: italic;
    }
    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #EEE;
    }
    .reschedule-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #F9A825;
      background: white;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .reschedule-btn:hover { background: #FFF8E1; }
    .reschedule-btn span { color: #F9A825; font-weight: bold; font-size: 12px; }
    .cancel-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #C62828;
      background: white;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .cancel-btn:hover { background: #FFEBEE; }
    .cancel-btn span { color: #C62828; font-weight: bold; font-size: 12px; }

    /* Empty State */
    .empty-state {
      flex: 1;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 20px;
    }
    .empty-emoji { font-size: 50px; margin-bottom: 15px; }
    .empty-title { font-size: 18px; font-weight: bold; color: #1B5E20; margin-bottom: 8px; }
    .empty-text { color: #777; font-size: 14px; margin-bottom: 25px; }
    .book-btn {
      background: #F9A825;
      padding: 14px 30px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-block;
    }
    .book-btn span { color: #1B5E20; font-weight: bold; font-size: 15px; }

    /* Bottom Tabs */
    .bottom-tabs {
      background: white;
      border-top: 1px solid #E0E0E0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 16px 12px;
      height: 70px;
    }
    .tab-item { align-items: center; cursor: pointer; flex: 1; display: flex; flex-direction: column; }
    .tab-icon { font-size: 22px; color: #777; margin-bottom: 4px; }
    .tab-label { font-size: 11px; color: #777; font-weight: 500; }

    /* More Menu */
    .more-menu-overlay {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1001;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .more-menu-overlay.active { display: flex; }
    .more-menu-panel {
      background: white;
      width: 100%;
      max-width: 430px;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 24px;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .more-menu-title { font-size: 18px; font-weight: bold; color: #1B5E20; margin-bottom: 20px; }
    .more-menu-item { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid #F0F0F0; cursor: pointer; }
  </style>
</head>
<body>
<div class="phone-frame">
  <div class="green-header">
    <div class="header-top-row">
      <div class="back-button" id="backButton"><span class="back-arrow">←</span><span class="back-text">Back</span></div>
      <div class="student-badge" id="profileBtn">
        <span class="student-badge-text">Maria</span>
        <span class="student-badge-icon">▼</span>
      </div>
    </div>
    <div id="profileDropdown" class="profile-dropdown">
      <div class="dropdown-header"><h4>GUIDE-Me · Account Menu</h4><p>Student · VSU Isabel</p></div>
      <div class="dropdown-item" id="editProfileItem"><span class="dropdown-icon">✏️</span><span class="dropdown-text">Edit Profile</span></div>
      <div class="dropdown-item" id="logoutItem"><span class="dropdown-icon">🚪</span><span class="dropdown-text logout-text">Logout</span></div>
    </div>
  </div>

  <div class="main-content">
    <div class="page-header">
      <h1>My Appointments</h1>
      <p>VSU Isabel · Track your support journey</p>
    </div>

    <div class="appointments-container" id="appointmentsContainer">
      <!-- Appointment cards will be populated here -->
    </div>
  </div>

  <div class="bottom-tabs">
    <div class="tab-item" data-tab="dashboard"><div class="tab-icon">🏠</div><div class="tab-label">Home</div></div>
    <div class="tab-item" data-tab="appointments"><div class="tab-icon">📅</div><div class="tab-label">Appts</div></div>
    <div class="tab-item" data-tab="services"><div class="tab-icon">🗂️</div><div class="tab-label">Services</div></div>
    <div class="tab-item" id="moreBtn"><div class="tab-icon">☰</div><div class="tab-label">More</div></div>
  </div>
</div>

<div id="moreMenuOverlay" class="more-menu-overlay">
  <div class="more-menu-panel">
    <div class="more-menu-title">GUIDE-Me Menu</div>
    <div class="more-menu-item" id="personnelItem"><span class="more-menu-icon">👥</span><span class="more-menu-text">Personnel</span></div>
    <div class="more-menu-item" id="aboutItem"><span class="more-menu-icon">ℹ️</span><span class="more-menu-text">About GUIDE-Me</span></div>
  </div>
</div>

<script>
  // ============================================================
  // GUIDE-Me Appointments Page | Student Appointment Management
  // Dummy data matching the screenshot
  // ============================================================

  // Dummy appointments data
  const appointments = [
    {
      id: '1',
      service: 'Academic Monitoring',
      startTime: new Date(2026, 4, 29, 9, 0, 0),
      status: 'pending',
      department: null,
      completedBy: null,
      referralSource: null,
      rejectionReason: null
    },
    {
      id: '2',
      service: 'Managing Worries or Sadness',
      startTime: new Date(2026, 4, 26, 11, 0, 0),
      status: 'declined',
      department: null,
      completedBy: null,
      referralSource: null,
      rejectionReason: 'Let us reschedule, I suddenly have a meeting. ✋'
    },
    {
      id: '3',
      service: 'Accident, Disaster, or Calamity',
      startTime: new Date(2026, 4, 19, 10, 0, 0),
      status: 'completed',
      department: 'Department of Information Technology (DIT)',
      completedBy: 'Counselor',
      referralSource: 'dbgf',
      referredAt: '2026-05-14T16:00:15.744Z',
      rejectionReason: null
    },
    {
      id: '4',
      service: 'Self-awareness',
      startTime: new Date(2026, 4, 22, 10, 0, 0),
      status: 'completed',
      department: 'Department of Information Technology (DIT)',
      completedBy: 'DBGF',
      referralSource: null,
      rejectionReason: null
    },
    {
      id: '5',
      service: 'Overcoming Grief',
      startTime: new Date(2026, 4, 19, 11, 0, 0),
      status: 'completed',
      department: null,
      completedBy: 'Counselor',
      referralSource: null,
      rejectionReason: null
    }
  ];

  // Helper: Format date
  function formatDate(date) {
    return date.toLocaleString('en-US', {
      month: 'numeric',
      day: 'numeric',
      year: 'numeric',
      hour: 'numeric',
      minute: '2-digit',
      hour12: true
    });
  }

  // Helper: Format referral date
  function formatReferralDate(dateString) {
    const date = new Date(dateString);
    return date.toLocaleString('en-US', {
      month: 'numeric',
      day: 'numeric',
      year: 'numeric',
      hour: 'numeric',
      minute: '2-digit',
      hour12: true
    });
  }

  // DOM Elements
  const profileDropdown = document.getElementById('profileDropdown');
  const profileBtn = document.getElementById('profileBtn');
  const backButton = document.getElementById('backButton');
  const moreMenuOverlay = document.getElementById('moreMenuOverlay');
  const moreBtn = document.getElementById('moreBtn');

  // Toggle profile dropdown
  function toggleProfileDropdown() { profileDropdown.classList.toggle('active'); }
  function closeProfileDropdown() { profileDropdown.classList.remove('active'); }

  // Profile button click
  profileBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleProfileDropdown();
    moreMenuOverlay.classList.remove('active');
  });

  // Close dropdown when clicking outside
  document.addEventListener('click', (e) => {
    if (!profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) {
      closeProfileDropdown();
    }
  });

  // ========== NAVIGATION INTEGRATION ==========

  // Tab switching function
  function switchTab(tab) {
    if (tab === 'dashboard') {
      window.location.href = "index.html";    
    } else if (tab === 'appointments') {
      window.location.href = "appointments.html";    
    } else if (tab === 'services') {
      window.location.href = "services.html";    
    }
    closeProfileDropdown();
  }

  // Tab click handlers
  document.querySelectorAll('.tab-item[data-tab]').forEach(item => {
    item.addEventListener('click', () => {
      const tab = item.getAttribute('data-tab');
      switchTab(tab);
      moreMenuOverlay.classList.remove('active');
    });
  });

  // Back button handler - Go back to dashboard
  backButton.addEventListener('click', () => {
    window.location.href = "index.html";
  });

  // Edit Profile action
  document.getElementById('editProfileItem').addEventListener('click', () => {
    closeProfileDropdown();
    window.location.href = "edit-profile.html";
  });

  // Logout action
  document.getElementById('logoutItem').addEventListener('click', () => {
    closeProfileDropdown();
    window.location.href = "login.html";
  });

  // More menu handlers
  moreBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    moreMenuOverlay.classList.toggle('active');
    closeProfileDropdown();
  });

  moreMenuOverlay.addEventListener('click', (e) => {
    if (e.target === moreMenuOverlay) {
      moreMenuOverlay.classList.remove('active');
    }
  });

  // Personnel menu item
  document.getElementById('personnelItem').addEventListener('click', () => {
    moreMenuOverlay.classList.remove('active');
    window.location.href = "personnel.html";
  });

  // About menu item
  document.getElementById('aboutItem').addEventListener('click', () => {
    moreMenuOverlay.classList.remove('active');
    window.location.href = "about.html";
  });

  // Render appointments
  function renderAppointments() {
    const container = document.getElementById('appointmentsContainer');
    
    if (appointments.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-emoji">🍃</div>
          <div class="empty-title">No Appointments Yet</div>
          <div class="empty-text">You haven't requested any sessions with the Guidance Office or your DBGF.</div>
          <div class="book-btn" id="bookNowBtn"><span>Book an Appointment →</span></div>
        </div>
      `;
      const bookBtn = document.getElementById('bookNowBtn');
      if (bookBtn) {
        bookBtn.onclick = () => { window.location.href = "booking.html"; };
      }
      return;
    }

    container.innerHTML = appointments.map(app => {
      let statusHTML = '';
      let actionHTML = '';
      
      if (app.status === 'completed') {
        statusHTML = `<div class="status-badge completed">✓ Done by ${app.completedBy}</div>`;
      } else if (app.status === 'declined') {
        statusHTML = `<div class="rejection-reason">❌ Declined — ${app.rejectionReason}</div>`;
      } else if (app.status === 'pending') {
        statusHTML = `<div class="status-badge pending">⏳ Pending Approval</div>`;
        actionHTML = `
          <div class="action-row">
            <div class="reschedule-btn" data-id="${app.id}" data-action="reschedule"><span>✏️ Reschedule</span></div>
            <div class="cancel-btn" data-id="${app.id}" data-action="cancel"><span>🗑️ Cancel</span></div>
          </div>
        `;
      }
      
      let referralHTML = '';
      if (app.referralSource === 'dbgf' && app.referredAt) {
        referralHTML = `<div class="referral-note">📨 Referred from DBGF at ${formatReferralDate(app.referredAt)}</div>`;
      }
      
      let departmentHTML = '';
      if (app.department) {
        departmentHTML = `<div class="department">🏫 Department: ${app.department}</div>`;
      }
      
      return `
        <div class="card" data-id="${app.id}">
          <div class="service-name">${app.service}</div>
          <div class="date">📅 ${formatDate(app.startTime)}</div>
          ${departmentHTML}
          ${statusHTML}
          ${referralHTML}
          ${actionHTML}
        </div>
      `;
    }).join('');
    
    // Add event listeners for reschedule and cancel buttons
    document.querySelectorAll('.reschedule-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.getAttribute('data-id');
        const appointment = appointments.find(a => a.id === id);
        window.location.href = "booking.html";
      });
    });
    
    document.querySelectorAll('.cancel-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.getAttribute('data-id');
        const appointment = appointments.find(a => a.id === id);
        if (confirm('Are you sure you want to cancel this appointment?')) {
          alert(`✅ Appointment "${appointment.service}" has been cancelled.\n\n(Prototype demonstration - to be integrated with Firebase later)`);
          // In a real app, you would delete from database here
        }
      });
    });
  }

  // Close modals with Escape key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeProfileDropdown();
      moreMenuOverlay.classList.remove('active');
    }
  });

  // Initialize
  renderAppointments();
  console.log('✅ Appointments page loaded | Navigation fully integrated');
</script>
</body>
</html>
